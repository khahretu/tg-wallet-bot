services:
  - type: web
    name: landing-pages
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn landing_pages:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bot-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: CDN_PUBLIC_URL
        sync: false
      - key: PUBLIC_DOMAINS
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADSENSE_CLIENT
        sync: false
      - key: ADSENSE_SLOT
        sync: false

  - type: worker
    name: telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bot-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: CDN_PUBLIC_URL
        sync: false
      - key: PUBLIC_DOMAINS
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADSENSE_CLIENT
        sync: false
      - key: ADSENSE_SLOT
        sync: false

databases:
  - name: bot-db
    databaseName: bot_db
    user: bot_user
    plan: free
